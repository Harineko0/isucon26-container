log_format ltsv "time:$time_iso8601\thost:$http_x_client_ip\tmethod:$request_method\turi:$request_uri\tstatus:$status\tsize:$body_bytes_sent\treqtime:$request_time\tapptime:$upstream_response_time";

upstream app {
  server 127.0.0.1:8080;
  keepalive 128;
}

server {
  listen 80 default_server;
  server_name _;

  access_log /var/log/nginx/access.log ltsv buffer=256k flush=1s;
  client_max_body_size 32m;
  root /home/isucon/webapp/public;

  location /api/notifications {
    proxy_set_header Host $host;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_read_timeout 3600s;
    proxy_pass http://app;
  }

  location /api/ {
    proxy_set_header Host $host;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    # Keep uploads (max ~1 MB) and image responses (max ~0.9 MB) in memory
    # instead of /var/lib/nginx/{body,proxy} temp files. Larger bodies (exports
    # up to ~5.5 MB) still overflow to a temp file as before. See infra/notes/nginx-buffers.md
    client_body_buffer_size 2m;
    proxy_buffer_size 16k;
    proxy_buffers 64 16k;
    proxy_pass http://app;
  }

  location / {
    try_files $uri /index.html;
  }
}
