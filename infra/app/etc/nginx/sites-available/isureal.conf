log_format ltsv "time:$time_iso8601\thost:$http_x_client_ip\tmethod:$request_method\turi:$request_uri\tstatus:$status\tsize:$body_bytes_sent\treqtime:$request_time\tapptime:$upstream_response_time";

# Only stream PUT bodies with a declared length. In particular nginx must
# finish checking the 32 MiB limit on chunked bodies before invoking Go.
map "$request_method:$uri:$content_length" $stream_profile_upload {
  default 0;
  ~^PUT:/api/me/profile-image:[0-9]+$ 1;
}

# Only inter-app TCP connections retain the peer credential. Public requests
# arrive from the router; their client-controlled forwarding headers are ignored.
map $remote_addr $image_peer_credential {
  default "";
  192.168.1.10 $http_x_isureal_internal;
  192.168.2.10 $http_x_isureal_internal;
  192.168.3.10 $http_x_isureal_internal;
}

upstream app {
  server 127.0.0.1:8080;
  keepalive 128;
}

server {
  listen 80 default_server;
  server_name _;

  access_log /var/log/nginx/access.log ltsv buffer=256k flush=1s;
  client_max_body_size 32m;
  root /home/isucon/webapp/public;

  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header Connection "";
  proxy_set_header X-Isureal-Internal $image_peer_credential;

  location /api/notifications {
    proxy_buffering off;
    proxy_read_timeout 3600s;
    proxy_pass http://app;
  }

  location @profile_upload {
    proxy_request_buffering off;
    proxy_pass http://app;
  }

  location /api/ {
    # A named location preserves the original method, URI and query string.
    error_page 418 = @profile_upload;
    if ($stream_profile_upload) { return 418; }
    # Keep uploads (max ~1 MB) and image responses (max ~0.9 MB) in memory
    # instead of /var/lib/nginx/{body,proxy} temp files. Larger bodies (exports
    # up to ~5.5 MB) still overflow to a temp file as before. See infra/notes/nginx-buffers.md
    client_body_buffer_size 2m;
    proxy_buffer_size 16k;
    proxy_buffers 64 16k;
    proxy_pass http://app;
  }

  # 画像 (GET /api/images/:id) の本体がディスクにあるとき、Go は X-Accel-Redirect: /_imgcache/xx/<id>
  # (または /_imgstore/...) だけを返し、nginx が sendfile でファイルを返す (image_api.go / image_cache.go)。
  # internal なので外から直接は開けない (404)。Content-Type と Cache-Control は Go の応答から引き継ぐ。
  # 従来 (Go が本体を返す) と同じヘッダにするため、静的ファイル配信で増える
  # ETag / Last-Modified / Accept-Ranges は付けず、条件付き要求・Range も扱わない。
  location /_imgcache/ {
    internal;
    alias /home/isucon/imgcache/;
    aio threads=image_reads;
    etag off;
    if_modified_since off;
    max_ranges 0;
    add_header Last-Modified "";
  }
  location /_imgstore/ {
    internal;
    alias /home/isucon/imgstore/;
    aio threads=image_reads;
    etag off;
    if_modified_since off;
    max_ranges 0;
    add_header Last-Modified "";
  }

  location / {
    try_files $uri /index.html;
  }
}
