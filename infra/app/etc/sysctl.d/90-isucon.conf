net.ipv4.ip_local_port_range = 10000 65535
# #240: imgcache（約 180 万ファイル）の ext4 inode/dentry cache がメモリを圧迫し、ベンチ中に kswapd/kcompactd が回る。
# GET 1 回は stat 1 回で再利用価値が低いので、ページキャッシュより先に回収させる（既定 100）。
vm.vfs_cache_pressure = 500
# #240: asia1 はベンチ中に直接回収（pgsteal_direct 16.9k ページ、allocstall）が起きる。low と min の差が
# DMA32 14 MB・Normal 2 MB しかなく、画像アップロードの山で kswapd が間に合わない。差をメモリの 2%（約 76 MB）にして
# kswapd を早めに起こす（既定 10 = 0.1%）。回収のタイミングだけが変わり、使えるメモリは減らない。
vm.watermark_scale_factor = 200
