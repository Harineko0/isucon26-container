net.ipv4.ip_local_port_range = 10000 65535
# DB (asia2) へのプール接続は長寿命で、europe1/america1 からは往復 100ms。既定 (1) だと
# 再送タイムアウト (約 300ms) 以上あいた接続や、小さいクエリばかりの接続は輻輳ウィンドウが
# 初期値 10 セグメント (約 89KB) に戻り、投稿画像 (平均 509KB) の送信に 4〜5 往復かかる。
# 0 にすると一度広がったウィンドウを保つ。実測 (europe1→asia2、600KB の SELECT):
# あいた後 513ms / 続けて 127ms。帯域制限・遅延はそのまま (ルーターが制御する)。
net.ipv4.tcp_slow_start_after_idle = 0
