[databases]
isureal = host=127.0.0.1 port=5432 dbname=isureal connect_query='SET plan_cache_mode = force_generic_plan'
isureal_reads = host=127.0.0.1 port=5432 dbname=isureal pool_size=8 connect_query='SET plan_cache_mode = force_generic_plan'

[pgbouncer]
listen_addr = 192.168.4.10
listen_port = 6432
unix_socket_dir =
auth_type = scram-sha-256
auth_file = /run/isureal-db-pool/users.txt
pool_mode = transaction
default_pool_size = 16
max_client_conn = 384
max_prepared_statements = 128
server_tls_sslmode = disable
log_connections = 0
log_disconnections = 0
