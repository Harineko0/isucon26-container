net.ipv4.ip_local_port_range = 10000 65535
# europe1/america1 への応答 (画像の bytea、エクスポートなど) も往復 100ms の接続で返す。
# 既定 (1) だとあいた接続の輻輳ウィンドウが初期値 (約 89KB) に戻り、大きい応答に数往復かかる。
# 実測 (asia2→europe1、600KB の SELECT): あいた後 413ms / 続けて 127ms。
# 詳細は infra/app/etc/sysctl.d/90-isucon.conf。
net.ipv4.tcp_slow_start_after_idle = 0
