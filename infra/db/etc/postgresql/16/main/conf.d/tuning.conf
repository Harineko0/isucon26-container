max_connections = 200
shared_buffers = 768MB
effective_cache_size = 3GB
work_mem = 4MB
maintenance_work_mem = 128MB
random_page_cost = 1.1
effective_io_concurrency = 200
wal_buffers = 16MB
checkpoint_timeout = 15min
max_wal_size = 4GB
# pg_prewarm: autoprewarm (default on) saves the shared_buffers block list every 300s
# and reloads it at startup. Needs a PostgreSQL restart; see infra/notes/postgresql-prewarm.md
shared_preload_libraries = 'pg_stat_statements,pg_prewarm'
pg_stat_statements.max = 10000
pg_stat_statements.track = all
track_io_timing = on
log_min_duration_statement = 100
