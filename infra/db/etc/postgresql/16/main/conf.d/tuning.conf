max_connections = 200
shared_buffers = 768MB
effective_cache_size = 3GB
work_mem = 4MB
maintenance_work_mem = 128MB
random_page_cost = 1.1
effective_io_concurrency = 200
wal_buffers = 16MB
checkpoint_timeout = 15min
# #81 #76: see infra/notes/postgresql-wal-bgwriter.md. All reloadable (sighup/superuser).
# Checkpoint distance 2.2GB -> 4.3GB: every checkpoint was "starting: wal", one per bench.
max_wal_size = 8GB
# bgwriter was capped (maxwritten_clean 4,821; backends wrote 2.8M buffers vs bgwriter 0.7M).
bgwriter_delay = 20ms
bgwriter_lru_maxpages = 1000
bgwriter_lru_multiplier = 4.0
# wal_buffers (16MB, restart-only) filled 8k times per bench; drain it 100x/s instead.
wal_writer_delay = 10ms
# Measurement only: pg_stat_wal.wal_write_time / wal_sync_time.
track_wal_io_timing = on
# Group commit (reloadable, durability unchanged: every commit still waits for its own fsync).
# pg_stat_wal on 2026-10-31 16:55 JST: wal_sync 550,656 / wal_sync_time 1,159 s over ~80 benches
# = ~6.9k fsyncs and ~14 s of WAL fsync per bench (~2 ms each on EBS), while DB wait sampling
# shows LWLock:WALWrite + IO:WALSync at ~10% of all waits. With 64+40+40 backends committing
# concurrently, a committer that sees >= 5 other active transactions waits up to 1 ms so that
# their commits share one WAL flush. Costs at most +1 ms per commit (asia RTT is 1 ms, EU/US 100 ms).
commit_delay = 1000
commit_siblings = 5
shared_preload_libraries = 'pg_stat_statements'
pg_stat_statements.max = 10000
pg_stat_statements.track = all
track_io_timing = on
log_min_duration_statement = 100
