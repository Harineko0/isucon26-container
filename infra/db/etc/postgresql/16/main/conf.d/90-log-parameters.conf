# Slow statements (log_min_duration_statement) log their bind parameters.
# The default -1 writes each parameter in full, so every slow image INSERT
# dumped the whole bytea as hex (~1 MB per line). Keep 64 bytes per parameter:
# UUIDs (36 chars) and timestamps stay readable for EXPLAIN, images get cut.
# Reloadable (context=superuser); no restart. See infra/notes/postgresql-log-parameters.md
log_parameter_max_length = 64
log_parameter_max_length_on_error = 0
