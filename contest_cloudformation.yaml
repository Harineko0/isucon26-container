              }
              attempt=1
              while [ "$attempt" -le 12 ]; do
                if curl --fail --silent --show-error --connect-timeout 5 --max-time 10 --output "$downloaded" 'https://portal.isucon.net/api/ssh_public_keys?token=szD2TS0Sf5I4ok7jhBHBiE9X-MBjsI17Ic1PJtW044eKEeObCvyc_6jLDDvelYXk:eyJ0ZWFtX2lkIjoxMjAxMDcsImV4cGlyeSI6MTc5MzUyMzYwMH0' && valid_keys; then
                  chmod 0600 "$downloaded"
                  chown isucon:isucon "$downloaded"
                  mv -f "$downloaded" "$keydir/authorized_keys"
                  exit 0
                fi
                echo "SSH key download or validation failed (attempt $attempt/12); existing keys retained" >&2
                if [ "$attempt" -lt 12 ]; then sleep 10; fi
                attempt=$((attempt + 1))
              done
              echo "Could not install SSH keys; check portal key registration and rerun this cloud-init command" >&2
