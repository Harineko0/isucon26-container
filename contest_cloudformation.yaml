  DatabaseIP:
    Type: AWS::EC2::EIP
    DependsOn: InternetGatewayAttachment
    Properties:
      Domain: vpc
      InstanceId: !Ref Database

  ServerACL:
    Type: AWS::EC2::NetworkAcl
    Properties:
      VpcId: !Ref VPC
  ServerACLIngress:
    Type: AWS::EC2::NetworkAclEntry
    Properties:
      NetworkAclId: !Ref ServerACL
      RuleNumber: 1000
      Protocol: -1
      RuleAction: allow
      Egress: false
      CidrBlock: 0.0.0.0/0
  ServerACLBlockRouterPublicIP:
    Type: AWS::EC2::NetworkAclEntry
    Properties:
      NetworkAclId: !Ref ServerACL
      RuleNumber: 100
      Protocol: -1
      RuleAction: deny
      Egress: true
      CidrBlock: !Sub '${RouterIP}/32'
  ServerACLBlockRouterPublicSubnet:
    Type: AWS::EC2::NetworkAclEntry
    Properties:
      NetworkAclId: !Ref ServerACL
      RuleNumber: 110
      Protocol: -1
      RuleAction: deny
      Egress: true
      CidrBlock: 192.168.11.0/24
  ServerACLEgress:
    Type: AWS::EC2::NetworkAclEntry
    Properties:
      NetworkAclId: !Ref ServerACL
      RuleNumber: 1000
      Protocol: -1
      RuleAction: allow
      Egress: true
      CidrBlock: 0.0.0.0/0

  App1ACLAssociation:
    Type: AWS::EC2::SubnetNetworkAclAssociation
    Properties:
      SubnetId: !Ref App1Subnet
      NetworkAclId: !Ref ServerACL

  App2ACLAssociation:
    Type: AWS::EC2::SubnetNetworkAclAssociation
    Properties:
      SubnetId: !Ref App2Subnet
      NetworkAclId: !Ref ServerACL

  App3ACLAssociation:
    Type: AWS::EC2::SubnetNetworkAclAssociation
    Properties:
      SubnetId: !Ref App3Subnet
      NetworkAclId: !Ref ServerACL

  DatabaseACLAssociation:
    Type: AWS::EC2::SubnetNetworkAclAssociation
    Properties:
      SubnetId: !Ref DatabaseSubnet
      NetworkAclId: !Ref ServerACL

  Router:
    Type: AWS::EC2::Instance
    DependsOn: [PublicDefaultRoute, RouterPublicRoutes]
    Properties:
      IamInstanceProfile: !Ref EnvcheckInstanceProfile
      ImageId: ami-0d74406faa8e09fa6
      InstanceType: c6in.large
      NetworkInterfaces:
        - DeviceIndex: '0'
          NetworkInterfaceId: !Ref RouterPublicInterface
        - DeviceIndex: '1'
          NetworkInterfaceId: !Ref RouterDataInterface
      MetadataOptions:
        HttpTokens: required
      BlockDeviceMappings:
        - DeviceName: /dev/sda1
          Ebs:
            VolumeType: gp3
            DeleteOnTermination: true
      Tags:
        - Key: Name
          Value: isucon2026-contest-router
        - Key: IsuconTeamID
          Value: '120107'
        - Key: IsuconInstanceNum
          Value: '5'
      UserData:
        Fn::Base64: |
          #cloud-config
          users:
            - default
            - name: isuadmin
              shell: /bin/bash
              lock_passwd: true
              sudo: ['ALL=(ALL) NOPASSWD:ALL']
              ssh_authorized_keys: ['ssh-rsa ']

          bootcmd:
            - [dpkg, --purge, ec2-instance-connect]
            - [systemctl, daemon-reload]
            - [systemctl, try-restart, ssh.service]
          write_files:
          - path: /etc/isucon/envcheck.json
            permissions: '0600'
            content: '{"service_ami":"ami-046bb2179ba4818ab","router_ami":"ami-0d74406faa8e09fa6","types":["c5.large","c7i.large","c7i.large","c5.large","c6in.large"]}'
          - path: /etc/isucon/registration.json
            permissions: '0600'
            encoding: b64
            content: 'eyJob3N0IjoicG9ydGFsLmlzdWNvbi5uZXQiLCJudW1iZXIiOjUsInRva2VuIjoic3pEMlRTMFNmNUk0b2s3amhCSEJpRTlYLU1CanNJMTdJYzFQSnRXMDQ0ZUtFZU9iQ3Z5Y182akxERHZlbFlYazpleUowWldGdFgybGtJam94TWpBeE1EY3NJbVY0Y0dseWVTSTZNVGM1TXpVeU16WXdNSDAifQ=='
          - path: /opt/isucon-registration/register.py
            permissions: '0700'
            encoding: gz+b64
            content: ''
          - path: /opt/isucon-registration/router-bootstrap.py
            permissions: '0700'
            encoding: gz+b64
            content: ''
          - path: /etc/isucon/router.env
            owner: root:isureal-router
            permissions: '0640'
            content: |
              ROUTER_PORTAL_ENDPOINT=http://127.0.0.1:18082
              ROUTER_TEAM_NUMBER=120107
              ROUTER_STATUS_LISTEN_ADDRESS=192.168.11.10:18081
              ROUTER_HTTP_LISTEN_ADDRESS=0.0.0.0:8080
              ROUTER_HTTPS_LISTEN_ADDRESS=0.0.0.0:443
              ROUTER_TLS_CERTIFICATE=/etc/isucon/haproxy/tls/server.pem
              ROUTER_UPSTREAM_PORT=80

              ROUTER_APP1_SUBNET=192.168.1.0/24
              ROUTER_APP1_REGION_LOCAL_IP=192.168.10.10
              ROUTER_APP1_IP=192.168.1.10

              ROUTER_APP2_SUBNET=192.168.2.0/24
              ROUTER_APP2_REGION_LOCAL_IP=192.168.10.10
              ROUTER_APP2_IP=192.168.2.10

              ROUTER_APP3_SUBNET=192.168.3.0/24
              ROUTER_APP3_REGION_LOCAL_IP=192.168.10.10
              ROUTER_APP3_IP=192.168.3.10

              ROUTER_DB1_SUBNET=192.168.4.0/24
              ROUTER_DB1_REGION_LOCAL_IP=192.168.10.10
              ROUTER_DB1_IP=192.168.4.10

          - path: /etc/isucon/portal.env
            owner: root:isureal-router
            permissions: '0640'
            content: |
              PORTAL_TEAM_NUMBER=120107
              PORTAL_TEAM_HASH=aws
              PORTAL_DOMAIN_SUFFIX=127.0.0.1.nip.io
              PORTAL_ROUTER_MODE=external-router
              PORTAL_LISTEN_ADDRESS=127.0.0.1:18082
              PORTAL_WEB_DIR=
          - path: /etc/systemd/system/isucon-register.service.d/router.conf
            permissions: '0644'
            content: |
              [Unit]
              Wants=isucon-router-bootstrap.service
              After=isucon-router-bootstrap.service
              [Service]
              ExecStartPre=/usr/bin/systemctl is-active isucon-router-bootstrap.service
          - path: /etc/systemd/system/isucon-router-bootstrap.service
            permissions: '0644'
            content: |
              [Unit]
              Description=Configure ISUCON2026 Router network on every boot
              Wants=network-online.target
              After=network-online.target cloud-final.service
              StartLimitIntervalSec=0
              [Service]
              Type=oneshot
              ExecStart=/usr/bin/python3 /opt/isucon-registration/router-bootstrap.py
              ExecStart=/usr/bin/systemctl start isureal-portal isureal-router isureal-haproxy
              Restart=on-failure
              RestartSec=10s
              RemainAfterExit=yes
              [Install]
              WantedBy=cloud-init.target

          - path: /etc/systemd/system/isucon-register.service
            permissions: '0644'
            content: |
              [Unit]
              Description=Register the contest instance with the portal on every boot
              Wants=network-online.target
              After=network-online.target cloud-final.service
              StartLimitIntervalSec=0
              [Service]
              Type=oneshot
              ExecStart=/usr/bin/python3 /opt/isucon-registration/register.py
              Restart=on-failure
              RestartSec=20s
              RemainAfterExit=yes
              [Install]
              WantedBy=cloud-init.target

          runcmd:
            - |
              set -eu
              umask 077
              cd /etc/isucon/haproxy/tls
              openssl req -x509 -newkey rsa:2048 -nodes -days 365 -subj '/CN=app.team120107-aws.127.0.0.1.nip.io' -keyout server.key -out server.crt
              cat server.crt server.key > server.pem
              chown root:isureal-router server.pem
              chmod 0640 server.pem
              rm server.key server.crt
            - systemctl daemon-reload
            - systemctl enable --now --no-block isucon-router-bootstrap.service
            - systemctl enable --now --no-block isucon-register.service
            - systemctl enable --now --no-block envcheck.service
  RouterIP:
    Type: AWS::EC2::EIP
    DependsOn: InternetGatewayAttachment
    Properties:
      Domain: vpc
  RouterIPAssociation:
    Type: AWS::EC2::EIPAssociation
    Properties:
      AllocationId: !GetAtt RouterIP.AllocationId
      NetworkInterfaceId: !Ref RouterPublicInterface
Outputs:

  App1PublicIP:
    Value: !Ref App1IP

  App2PublicIP:
    Value: !Ref App2IP

  App3PublicIP:
    Value: !Ref App3IP

  DatabasePublicIP:
    Value: !Ref DatabaseIP

  RouterPublicIP:
    Value: !Ref RouterIP
  BenchmarkHost:
    Value: 'app.team120107-aws.127.0.0.1.nip.io'

