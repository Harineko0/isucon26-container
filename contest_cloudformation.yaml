AWSTemplateFormatVersion: 2010-09-09
Description: >-
  AWS CloudFormation for ISUCON2026 Contest
Resources:
  EnvcheckRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: ec2.amazonaws.com}
            Action: sts:AssumeRole
      Policies:
        - PolicyName: EnvironmentInspection
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [ec2:DescribeInstances, ec2:DescribeVolumes, ec2:DescribeSecurityGroups, ec2:DescribeRouteTables, ec2:DescribeNetworkAcls]
                Resource: '*'
  EnvcheckInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles: [!Ref EnvcheckRole]
  GetAvailabilityZoneFunctionExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
            Action:
              - sts:AssumeRole
      Path: "/"
      Policies:
        - PolicyName: GetAvailabilityZoneFunctionPolicy
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action:
                  - ec2:DescribeAvailabilityZones
                Resource: "*"
  GetAvailabilityZoneFunction:
    Type: AWS::Lambda::Function
    Properties:
      Code:
        ZipFile: |
          import cfnresponse
          import boto3
          def handler(event, context):
            if event['RequestType'] in ("Create", "Update"):
              ec2 = boto3.client('ec2')
              response = ec2.describe_availability_zones(
                ZoneIds = ['apne1-az2']
              )
              ZoneName = response['AvailabilityZones'][0]['ZoneName']
              cfnresponse.send(event, context, cfnresponse.SUCCESS, {"ZoneName" : ZoneName})
            elif event['RequestType'] == "Delete":
              cfnresponse.send(event, context, cfnresponse.SUCCESS, {})
      Handler: index.handler
      Runtime: python3.12
      Timeout: 30
      Role: !GetAtt GetAvailabilityZoneFunctionExecutionRole.Arn
  GetAvailabilityZone:
    Type: Custom::PythonLambdaExecution
    Properties:
      ServiceToken: !GetAtt GetAvailabilityZoneFunction.Arn

  VPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: "192.168.0.0/16"
      EnableDnsSupport: "true"
      EnableDnsHostnames: "true"
      InstanceTenancy: default
  InternetGateway:
    Type: AWS::EC2::InternetGateway
  InternetGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      InternetGatewayId: !Ref InternetGateway
      VpcId: !Ref VPC
  ServiceLaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateData:
        BlockDeviceMappings:
          - DeviceName: /dev/sda1
            Ebs:
              VolumeType: gp3
              VolumeInitializationRate: 300
              DeleteOnTermination: true
  DatabaseLaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateData:
        BlockDeviceMappings:
          - DeviceName: /dev/sda1
            Ebs:
              VolumeType: gp3
              VolumeInitializationRate: 300
              Iops: 6000
              Throughput: 200
              DeleteOnTermination: true
  RouterPublicSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      AvailabilityZone: !GetAtt GetAvailabilityZone.ZoneName
      CidrBlock: 192.168.11.0/24
  RouterDataSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      AvailabilityZone: !GetAtt GetAvailabilityZone.ZoneName
      CidrBlock: 192.168.10.0/24
  PublicRoutes:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
  PublicDefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: InternetGatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRoutes
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway
  RouterPublicRoutes:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref RouterPublicSubnet
      RouteTableId: !Ref PublicRoutes
  RouterPublicSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      VpcId: !Ref VPC
      GroupDescription: Benchmark ingress to the Router
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 8080
          ToPort: 8080
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
  RouterDataSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      VpcId: !Ref VPC
      GroupDescription: Forward traffic between contest servers
      SecurityGroupIngress:

        - IpProtocol: '-1'
          CidrIp: 192.168.1.0/24

        - IpProtocol: '-1'
          CidrIp: 192.168.2.0/24

        - IpProtocol: '-1'
          CidrIp: 192.168.3.0/24

        - IpProtocol: '-1'
          CidrIp: 192.168.4.0/24

  RouterPublicInterface:
    Type: AWS::EC2::NetworkInterface
    Properties:
      SubnetId: !Ref RouterPublicSubnet
      PrivateIpAddress: 192.168.11.10
      GroupSet: [!Ref RouterPublicSecurityGroup]
  RouterDataInterface:
    Type: AWS::EC2::NetworkInterface
    Properties:
      SubnetId: !Ref RouterDataSubnet
      PrivateIpAddress: 192.168.10.10
      SourceDestCheck: false
      GroupSet: [!Ref RouterDataSecurityGroup]


  App1Subnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      AvailabilityZone: !GetAtt GetAvailabilityZone.ZoneName
      CidrBlock: 192.168.1.0/24
  App1Routes:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
  App1RouteAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref App1Subnet
      RouteTableId: !Ref App1Routes
  App1DefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: InternetGatewayAttachment
    Properties:
      RouteTableId: !Ref App1Routes
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  App1ToApp2:
    Type: AWS::EC2::Route
    DependsOn: [App2Subnet, Router]
    Properties:
      RouteTableId: !Ref App1Routes
      DestinationCidrBlock: 192.168.2.0/24
      NetworkInterfaceId: !Ref RouterDataInterface

  App1ToApp3:
    Type: AWS::EC2::Route
    DependsOn: [App3Subnet, Router]
    Properties:
      RouteTableId: !Ref App1Routes
      DestinationCidrBlock: 192.168.3.0/24
      NetworkInterfaceId: !Ref RouterDataInterface

  App1ToDatabase:
    Type: AWS::EC2::Route
    DependsOn: [DatabaseSubnet, Router]
    Properties:
      RouteTableId: !Ref App1Routes
      DestinationCidrBlock: 192.168.4.0/24
      NetworkInterfaceId: !Ref RouterDataInterface

  App1SecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      VpcId: !Ref VPC
      GroupDescription: Contest server SSH and routed traffic
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: 0.0.0.0/0
        - IpProtocol: '-1'
          CidrIp: 192.168.10.10/32

        - IpProtocol: '-1'
          CidrIp: 192.168.2.0/24

        - IpProtocol: '-1'
          CidrIp: 192.168.3.0/24

        - IpProtocol: '-1'
          CidrIp: 192.168.4.0/24

  App1:
    Type: AWS::EC2::Instance
    DependsOn: [App1DefaultRoute, App1RouteAssociation, App1ToApp2, App1ToApp3, App1ToDatabase]
    Properties:
      IamInstanceProfile: !Ref EnvcheckInstanceProfile
      ImageId: ami-046bb2179ba4818ab
      InstanceType: c5.large
      SubnetId: !Ref App1Subnet
      PrivateIpAddress: 192.168.1.10
      SecurityGroupIds: [!Ref App1SecurityGroup]
      MetadataOptions:
        HttpTokens: required
      LaunchTemplate:
        LaunchTemplateId: !Ref ServiceLaunchTemplate
        Version: !GetAtt ServiceLaunchTemplate.LatestVersionNumber
      Tags:
        - Key: Name
          Value: isucon2026-contest-1
        - Key: IsuconTeamID
          Value: '120107'
        - Key: IsuconInstanceNum
          Value: '1'
      UserData:
        Fn::Base64: |
          #cloud-config
          users:
            - default
            - name: isuadmin
              shell: /bin/bash
              lock_passwd: true
              sudo: ['ALL=(ALL) NOPASSWD:ALL']
              ssh_authorized_keys: ['ssh-rsa ']

          write_files:
          - path: /etc/isucon/envcheck.json
            permissions: '0600'
            content: '{"service_ami":"ami-046bb2179ba4818ab","router_ami":"ami-0d74406faa8e09fa6","types":["c5.large","c7i.large","c7i.large","c5.large","c6in.large"]}'
          - path: /opt/isucon-env-checker/portal_credentials.json
            permissions: '0600'
            encoding: b64
            content: 'eyJkZXYiOmZhbHNlLCJob3N0IjoicG9ydGFsLmlzdWNvbi5uZXQiLCJ0b2tlbiI6InN6RDJUUzBTZjVJNG9rN2poQkhCaUU5WC1NQmpzSTE3SWMxUEp0VzA0NGVLRWVPYkN2eWNfNmpMRER2ZWxZWGs6ZXlKMFpXRnRYMmxrSWpveE1qQXhNRGNzSW1WNGNHbHllU0k2TVRjNU16VXlNell3TUgwIn0='
          - path: /etc/isucon/registration.json
            permissions: '0600'
            encoding: b64
            content: 'eyJob3N0IjoicG9ydGFsLmlzdWNvbi5uZXQiLCJudW1iZXIiOjEsInRva2VuIjoic3pEMlRTMFNmNUk0b2s3amhCSEJpRTlYLU1CanNJMTdJYzFQSnRXMDQ0ZUtFZU9iQ3Z5Y182akxERHZlbFlYazpleUowWldGdFgybGtJam94TWpBeE1EY3NJbVY0Y0dseWVTSTZNVGM1TXpVeU16WXdNSDAifQ=='
          - path: /opt/isucon-registration/register.py
            permissions: '0700'
            encoding: gz+b64
            content: ''

          - path: /etc/systemd/system/isucon-register.service
            permissions: '0644'
            content: |
              [Unit]
              Description=Register the contest instance with the portal on every boot
              Wants=network-online.target
              After=network-online.target cloud-final.service
              StartLimitIntervalSec=0
              [Service]
              Type=oneshot
              ExecStart=/usr/bin/python3 /opt/isucon-registration/register.py
              Restart=on-failure
              RestartSec=20s
              RemainAfterExit=yes
              [Install]
              WantedBy=cloud-init.target

          runcmd:
            - |
              (
              set -eu
              umask 077
              keydir=/home/isucon/.ssh
              install -d -m 0700 -o isucon -g isucon "$keydir"
              downloaded=$(mktemp "$keydir/.downloaded.XXXXXX")
              candidate=$(mktemp "$keydir/.candidate.XXXXXX")
              trap 'rm -f "$downloaded" "$candidate"' EXIT HUP INT TERM
              valid_keys() {
                count=0
                while IFS= read -r key || [ -n "$key" ]; do
                  [ -n "$key" ] || continue
                  printf '%s\n' "$key" > "$candidate"
                  ssh-keygen -l -f "$candidate" >/dev/null 2>&1 || return 1
                  count=$((count + 1))
                done < "$downloaded"
                [ "$count" -gt 0 ]
              }
              attempt=1
              while [ "$attempt" -le 12 ]; do
                if curl --fail --silent --show-error --connect-timeout 5 --max-time 10 --output "$downloaded" 'https://portal.isucon.net/api/ssh_public_keys?token=szD2TS0Sf5I4ok7jhBHBiE9X-MBjsI17Ic1PJtW044eKEeObCvyc_6jLDDvelYXk:eyJ0ZWFtX2lkIjoxMjAxMDcsImV4cGlyeSI6MTc5MzUyMzYwMH0' && valid_keys; then
                  chmod 0600 "$downloaded"
                  chown isucon:isucon "$downloaded"
                  mv -f "$downloaded" "$keydir/authorized_keys"
                  exit 0
                fi
                echo "SSH key download or validation failed (attempt $attempt/12); existing keys retained" >&2
                if [ "$attempt" -lt 12 ]; then sleep 10; fi
                attempt=$((attempt + 1))
              done
              echo "Could not install SSH keys; check portal key registration and rerun this cloud-init command" >&2
              exit 1
              )


            - sed -i -e 's/^ISUREAL_REGION=.*/ISUREAL_REGION=asia/' -e 's/^ISUREAL_DB_HOST=.*/ISUREAL_DB_HOST=192.168.4.10/' /home/isucon/env.sh
            - systemctl enable --now isureal-go nginx
            - systemctl enable --now isureal-guard

            - systemctl daemon-reload
            - systemctl enable --now --no-block isucon-register.service
            - systemctl enable --now --no-block envcheck.service
  App1IP:
    Type: AWS::EC2::EIP
    DependsOn: InternetGatewayAttachment
    Properties:
      Domain: vpc
      InstanceId: !Ref App1

  App2Subnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      AvailabilityZone: !GetAtt GetAvailabilityZone.ZoneName
      CidrBlock: 192.168.2.0/24
  App2Routes:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
  App2RouteAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref App2Subnet
      RouteTableId: !Ref App2Routes
  App2DefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: InternetGatewayAttachment
    Properties:
      RouteTableId: !Ref App2Routes
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  App2ToApp1:
    Type: AWS::EC2::Route
    DependsOn: [App1Subnet, Router]
    Properties:
      RouteTableId: !Ref App2Routes
      DestinationCidrBlock: 192.168.1.0/24
      NetworkInterfaceId: !Ref RouterDataInterface

  App2ToApp3:
    Type: AWS::EC2::Route
    DependsOn: [App3Subnet, Router]
    Properties:
      RouteTableId: !Ref App2Routes
      DestinationCidrBlock: 192.168.3.0/24
      NetworkInterfaceId: !Ref RouterDataInterface

  App2ToDatabase:
    Type: AWS::EC2::Route
    DependsOn: [DatabaseSubnet, Router]
    Properties:
      RouteTableId: !Ref App2Routes
      DestinationCidrBlock: 192.168.4.0/24
      NetworkInterfaceId: !Ref RouterDataInterface

  App2SecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      VpcId: !Ref VPC
      GroupDescription: Contest server SSH and routed traffic
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: 0.0.0.0/0
        - IpProtocol: '-1'
          CidrIp: 192.168.10.10/32

        - IpProtocol: '-1'
          CidrIp: 192.168.1.0/24

        - IpProtocol: '-1'
          CidrIp: 192.168.3.0/24

        - IpProtocol: '-1'
          CidrIp: 192.168.4.0/24

  App2:
    Type: AWS::EC2::Instance
    DependsOn: [App2DefaultRoute, App2RouteAssociation, App2ToApp1, App2ToApp3, App2ToDatabase]
    Properties:
      IamInstanceProfile: !Ref EnvcheckInstanceProfile
      ImageId: ami-046bb2179ba4818ab
      InstanceType: c7i.large
      SubnetId: !Ref App2Subnet
      PrivateIpAddress: 192.168.2.10
      SecurityGroupIds: [!Ref App2SecurityGroup]
      MetadataOptions:
        HttpTokens: required
      LaunchTemplate:
        LaunchTemplateId: !Ref ServiceLaunchTemplate
        Version: !GetAtt ServiceLaunchTemplate.LatestVersionNumber
      Tags:
        - Key: Name
          Value: isucon2026-contest-2
        - Key: IsuconTeamID
          Value: '120107'
        - Key: IsuconInstanceNum
          Value: '2'
      UserData:
        Fn::Base64: |
          #cloud-config
          users:
            - default
            - name: isuadmin
              shell: /bin/bash
              lock_passwd: true
              sudo: ['ALL=(ALL) NOPASSWD:ALL']
              ssh_authorized_keys: ['ssh-rsa ']

          write_files:
          - path: /etc/isucon/envcheck.json
            permissions: '0600'
            content: '{"service_ami":"ami-046bb2179ba4818ab","router_ami":"ami-0d74406faa8e09fa6","types":["c5.large","c7i.large","c7i.large","c5.large","c6in.large"]}'
          - path: /opt/isucon-env-checker/portal_credentials.json
            permissions: '0600'
            encoding: b64
            content: 'eyJkZXYiOmZhbHNlLCJob3N0IjoicG9ydGFsLmlzdWNvbi5uZXQiLCJ0b2tlbiI6InN6RDJUUzBTZjVJNG9rN2poQkhCaUU5WC1NQmpzSTE3SWMxUEp0VzA0NGVLRWVPYkN2eWNfNmpMRER2ZWxZWGs6ZXlKMFpXRnRYMmxrSWpveE1qQXhNRGNzSW1WNGNHbHllU0k2TVRjNU16VXlNell3TUgwIn0='
          - path: /etc/isucon/registration.json
            permissions: '0600'
            encoding: b64
            content: 'eyJob3N0IjoicG9ydGFsLmlzdWNvbi5uZXQiLCJudW1iZXIiOjIsInRva2VuIjoic3pEMlRTMFNmNUk0b2s3amhCSEJpRTlYLU1CanNJMTdJYzFQSnRXMDQ0ZUtFZU9iQ3Z5Y182akxERHZlbFlYazpleUowWldGdFgybGtJam94TWpBeE1EY3NJbVY0Y0dseWVTSTZNVGM1TXpVeU16WXdNSDAifQ=='
          - path: /opt/isucon-registration/register.py
            permissions: '0700'
            encoding: gz+b64
            content: ''

          - path: /etc/systemd/system/isucon-register.service
            permissions: '0644'
            content: |
              [Unit]
              Description=Register the contest instance with the portal on every boot
              Wants=network-online.target
              After=network-online.target cloud-final.service
              StartLimitIntervalSec=0
              [Service]
              Type=oneshot
              ExecStart=/usr/bin/python3 /opt/isucon-registration/register.py
              Restart=on-failure
              RestartSec=20s
              RemainAfterExit=yes
              [Install]
              WantedBy=cloud-init.target

          runcmd:
            - |
              (
              set -eu
              umask 077
              keydir=/home/isucon/.ssh
              install -d -m 0700 -o isucon -g isucon "$keydir"
              downloaded=$(mktemp "$keydir/.downloaded.XXXXXX")
              candidate=$(mktemp "$keydir/.candidate.XXXXXX")
              trap 'rm -f "$downloaded" "$candidate"' EXIT HUP INT TERM
              valid_keys() {
                count=0
