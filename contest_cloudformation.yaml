            encoding: b64
            content: 'eyJob3N0IjoicG9ydGFsLmlzdWNvbi5uZXQiLCJudW1iZXIiOjMsInRva2VuIjoic3pEMlRTMFNmNUk0b2s3amhCSEJpRTlYLU1CanNJMTdJYzFQSnRXMDQ0ZUtFZU9iQ3Z5Y182akxERHZlbFlYazpleUowWldGdFgybGtJam94TWpBeE1EY3NJbVY0Y0dseWVTSTZNVGM1TXpVeU16WXdNSDAifQ=='
          - path: /opt/isucon-registration/register.py
            permissions: '0700'
            encoding: gz+b64
            content: ''

          - path: /etc/systemd/system/isucon-register.service
            permissions: '0644'
            content: |
              [Unit]
              Description=Register the contest instance with the portal on every boot
              Wants=network-online.target
              After=network-online.target cloud-final.service
              StartLimitIntervalSec=0
              [Service]
              Type=oneshot
              ExecStart=/usr/bin/python3 /opt/isucon-registration/register.py
