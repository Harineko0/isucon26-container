              )


            - sed -i -e 's/^ISUREAL_REGION=.*/ISUREAL_REGION=europe/' -e 's/^ISUREAL_DB_HOST=.*/ISUREAL_DB_HOST=192.168.4.10/' /home/isucon/env.sh
            - systemctl enable --now isureal-go nginx
            - systemctl enable --now isureal-guard

            - systemctl daemon-reload
            - systemctl enable --now --no-block isucon-register.service
            - systemctl enable --now --no-block envcheck.service
