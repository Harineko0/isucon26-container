# PR をマージ・クローズしたら、その PR の未完了の bench run（キュー待ち・実行中）をキャンセルする。
# 対象は run-name が `bench #<PR 番号>` の bench.yml の run（bench.yml の run-name を参照）。
# キャンセルされた run も finalize.sh（if: always()）がコメントと status を最終版にする。
name: bench-cancel

on:
  pull_request:
    types: [closed]

permissions:
  actions: write

jobs:
  cancel:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel bench runs for this PR
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -eu
          ids=$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/workflows/bench.yml/runs?per_page=100" \
            --jq ".workflow_runs[] | select(.status != \"completed\" and .display_title == \"bench #$PR_NUMBER\") | .id")
          for id in $ids; do
            echo "cancel run $id"
            gh api -X POST "repos/$GITHUB_REPOSITORY/actions/runs/$id/cancel" >/dev/null || echo "warn: cancel $id failed"
          done
          [ -n "$ids" ] || echo "no unfinished bench runs for #$PR_NUMBER"
