[package]
name = "isureal"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
anyhow = "1"
axum = "0.8"
base64 = "0.22"
bigdecimal = "0.4"
bytes = "1"
caseless = "0.2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
futures-util = "0.3"
hex = "0.4"
hmac = "0.12"
jpeg-decoder = { version = "0.3", default-features = false }
multer = "3"
percent-encoding = "2"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres", "macros", "chrono", "bigdecimal"] }
subtle = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "process", "time"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["catch-panic"] }
unicode-normalization = "0.1"
uuid = { version = "1", features = ["v4"] }
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "test-util"] }
