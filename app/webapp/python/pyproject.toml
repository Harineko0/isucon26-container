[project]
name = "isureal"
version = "0.1.0"
requires-python = ">=3.15"
dependencies = [
    "fastapi>=0.162.0",
    "gunicorn>=26.2.0",
    "pillow>=13.0.0",
    "psycopg[binary,pool]>=3.3.6",
    "python-multipart>=0.0.32",
    "uvicorn[standard]>=0.54.0",
    "uvicorn-worker>=0.4.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]

[tool.uv]
package = false

[tool.ruff.lint]
extend-select = [
    "UP", # pyupgrade
    "I", # isort
    "B", # flake8-bugbear
    "FAST", # FastAPI
]

[tool.mypy]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
