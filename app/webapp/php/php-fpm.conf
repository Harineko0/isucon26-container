; isureal の php-fpm 設定（開発環境と本番の両方で使う）
; nginx が /api/notifications を notifications プール（:9001）に、それ以外を www プール（:9000）に送る

[global]
; ログの出力先は起動する側が決める。コンテナでは /proc/self/fd/2。
; systemd の stderr はソケットなので /proc/self/fd/2 を開けない。syslog を指定し、--force-stderr で worker の出力とともに stderr（journal）へ出す
error_log = ${ISUREAL_PHP_FPM_ERROR_LOG}
syslog.ident = isureal-php
log_limit = 8192
daemonize = no

[www]
listen = 127.0.0.1:9000
listen.backlog = 4096
pm = static
pm.max_children = 16
clear_env = no
catch_workers_output = yes
decorate_workers_output = no
php_admin_value[memory_limit] = 512M
php_admin_value[post_max_size] = 64M
php_admin_value[upload_max_filesize] = 32M
php_admin_flag[display_errors] = off
php_admin_flag[log_errors] = on

; 通知（SSE）は届くまで接続を保持するので、待っている接続の数だけ worker を使う
[notifications]
listen = 127.0.0.1:9001
listen.backlog = 4096
pm = ondemand
pm.max_children = 256
pm.process_idle_timeout = 10s
clear_env = no
catch_workers_output = yes
decorate_workers_output = no
php_admin_value[memory_limit] = 64M
php_admin_flag[display_errors] = off
php_admin_flag[log_errors] = on
